# Runs on the developer laptop only. Phones on the same Wi-Fi reach the API on port 8000.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    environment:
      # Passed as parts, not one URL, so any character in the password is safe.
      SERVER_DB_HOST: db
      SERVER_DB_NAME: ${POSTGRES_DB}
      SERVER_DB_USER: ${POSTGRES_USER}
      SERVER_DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_ENABLE_DOCS: ${SERVER_ENABLE_DOCS:-false}
      SERVER_PUSH_ENABLED: ${SERVER_PUSH_ENABLED:-false}
      SERVER_CORS_ORIGINS: ${SERVER_CORS_ORIGINS:-}
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Stateless AI coach (milestone 9): no database, no volume, no access log.
  coach:
    build:
      context: .
      dockerfile: coach/Dockerfile
    environment:
      # Default: the Mac's own Ollama (uses the GPU). For the container below,
      # set COACH_OLLAMA_URL=http://ollama:11434 and run `docker compose --profile ollama up -d`.
      COACH_OLLAMA_URL: ${COACH_OLLAMA_URL:-http://host.docker.internal:11434}
      COACH_MODEL: ${COACH_MODEL:-qwen2.5:7b}
      COACH_CORS_ORIGINS: ${COACH_CORS_ORIGINS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # This computer only by default. For a phone, prefer `adb reverse tcp:8001 tcp:8001`
      # (the app then uses http://localhost:8001); COACH_BIND=0.0.0.0 opens it to the Wi-Fi.
      - "${COACH_BIND:-127.0.0.1}:8001:8001"

  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama

volumes:
  db-data:
  ollama-models:
