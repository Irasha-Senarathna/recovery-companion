[project]
name = "recovery-companion-ml"
version = "0.1.0"
description = "Synthetic data generator and risk model. Synthetic data only, never real user data."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: asserts in tests. S311: `random` is fine here; this is synthetic data, not security.
ignore = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["generate.py", "schema.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
