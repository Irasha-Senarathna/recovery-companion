# Support-circle API. Pin the image by digest for real deployments:
#   ghcr.io/irasha-senarathna/recovery-companion-server@sha256:...
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: recovery-companion
spec:
  selector:
    app: server
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: recovery-companion
spec:
  # One replica: the container runs database migrations when it starts.
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # appuser in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/irasha-senarathna/recovery-companion-server:latest
          env:
            - name: SERVER_DB_HOST
              value: db
            - name: SERVER_DB_NAME
              value: recovery_companion
            - name: SERVER_DB_USER
              valueFrom:
                secretKeyRef: { name: server-db, key: user }
            - name: SERVER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: server-db, key: password }
            - name: SERVER_ENABLE_DOCS
              value: "false"
            - name: SERVER_PUSH_ENABLED
              value: "false"
            # Trust X-Forwarded-For only from the ingress controller, so per-address
            # limits see each client. Set this to your cluster's pod network.
            - name: SERVER_TRUSTED_PROXIES
              value: 10.244.0.0/16
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
