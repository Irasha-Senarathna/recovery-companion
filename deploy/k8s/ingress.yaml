# HTTPS only. Assumes an ingress-nginx controller and cert-manager with a
# ClusterIssuer named "letsencrypt". Replace api.example.org with your domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: server
  namespace: recovery-companion
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The API only takes tiny JSON bodies.
    nginx.ingress.kubernetes.io/proxy-body-size: 16k
    # Request paths and client addresses are not logged (privacy design).
    nginx.ingress.kubernetes.io/enable-access-log: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.org]
      secretName: server-tls
  rules:
    - host: api.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 80
