# Android preview APK through EAS Build (free tier). Manual only, so the
# monthly free build quota is spent on purpose. Needs the EXPO_TOKEN secret
# (ideally an Expo robot token limited to this project).
#
# Only the "preview" profile: a development build carries the dev menu and the demo
# data loader, and can load code from any dev server, so it is never built here.
name: App preview (EAS)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android preview build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for the Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Access tokens). See docs/deploy.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Installed before the Expo token is in the environment, so no package's
      # install script can read it.
      - run: npm ci
        working-directory: app
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: "27.2.0"
          token: ${{ secrets.EXPO_TOKEN }}
      # Queues the build on EAS and returns. The APK link appears on expo.dev
      # and in the log below. No signing keys or secrets live in this repo.
      - name: Start the EAS build
        working-directory: app
        run: eas build --platform android --profile preview --non-interactive --no-wait
