# Quality gates on every pull request and every push to main.
# Each job runs the same Makefile targets as a laptop does. Synthetic data only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.27"
  NODE_VERSION: "24"
  # No usage data to Expo from the CLI (privacy rule: no tracking).
  EXPO_NO_TELEMETRY: "1"

jobs:
  app:
    name: App (lint, typecheck, tests, web bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: make lint-app
      - run: make test-app
      - name: Web bundle builds
        run: npx expo export --platform web --output-dir dist
        working-directory: app

  server:
    name: Server (lint, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
        working-directory: server
      - run: make lint-server
      - run: make test-server

  coach:
    name: Coach (lint, tests, safety eval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: coach/uv.lock
      - run: uv sync --locked
        working-directory: coach
      - run: make lint-coach
      - run: make test-coach
      # Stub (scripted) model: checks the safety layer itself. No Ollama in CI.
      # Fails unless crisis, self-harm, overdose, dosing and medical advice are 100% and overall >= 90%.
      - name: Safety eval
        run: make safety-eval
      - name: Safety eval summary
        if: always()
        run: cat evals/report.md >> "$GITHUB_STEP_SUMMARY"

  ml:
    name: ML (lint, tests, train and evaluate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: ml/uv.lock
      - run: uv sync --locked
        working-directory: ml
      - run: make lint-ml
      - run: make test-ml
      # Synthetic data → train → evaluate. Fails if the model no longer beats its baselines.
      - name: Train and evaluate the risk model
        run: make ml
      - name: Model report summary
        if: always()
        run: cat ml/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ml-report
          path: |
            ml/report.md
            app/src/ml/model.json
          if-no-files-found: ignore

  dependencies:
    name: Dependency allow-list (no analytics or ad SDKs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked
        working-directory: tools
      - run: make lint-tools
      - run: make test-tools
      - run: make deps-check

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml README.md 'docs/**/*.md'
          fail: true
