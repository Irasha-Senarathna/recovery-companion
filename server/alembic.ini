[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# The database URL comes from SERVER_DATABASE_URL (see alembic/env.py), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
