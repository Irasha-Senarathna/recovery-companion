[project]
name = "recovery-companion-server"
version = "0.1.0"
description = "Support-circle API: relays minimal 'please check in' signals. Stores no personal data."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the package is third-party.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
packages = ["app", "tests"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
